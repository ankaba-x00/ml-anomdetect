[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-anomdetect"
version = "2.0.0"
description = "Anomaly Detection Module providing Cloudflare fetching and data exploration, as well as autoencoder training, tuning and inference pipelines for real-time detection of global network threats"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "AnKaBa", email = "ankaba_x@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    # Core API framework
    "fastapi==0.123.0",
    "uvicorn==0.38.0",
    "dotenv==0.9.9",
    "requests==2.32.5",
    
    # Pytorch framework
    "torch==2.4.0",
    "torchvision==0.19.0",
    "torchaudio==2.4.0",

    # ML and data processing
    "numpy==1.26.4",
    "scikit-learn==1.6.1",
    "optuna==4.6.0",
    "fastparquet==2025.12.0",
    "pyarrow==22.0.0",
    
    # Data visualization
    "seaborn==0.13.2",
    "kaleido==1.2.0",
    "plotly==6.4.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "pytest==9.0.1",
    "ipykernel==6.31.0",
    "nbformat==5.10.4",
]

[tool.mypy]
files = ["app"]
python_version = "3.11"

exclude_gitignore = true

disallow_untyped_defs = true
#check_untyped_defs = true
disallow_untyped_decorators = true

allow_redefinition = true

warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
strict_equality = true

pretty = true
color_output = true
show_error_codes = true
show_column_numbers = true

exclude = [
    'build/',
    'dist/',
]

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torchaudio.*",
    "torchvision.*",
    "optuna.*",
    "fastparquet.*",
    "kaleido.*",
]
ignore_missing_imports = true